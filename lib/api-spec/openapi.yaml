          description: Forbidden
    put:
      operationId: upsertImpactScoreResult
      tags: [impact-score]
      summary: Create or update the Impact Score result
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactScoreResultInput"
      responses:
        "200":
          description: Saved Impact Score result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactScoreResult"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ─── BILAN CARBONE ──────────────────────────────────────────────────────────
  /organizations/{orgId}/carbon:
    get:
      operationId: getCarbonBilan
      tags: [carbon]
      summary: Get the carbon bilan for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Carbon bilan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarbonBilan"
        "404":
          description: No bilan yet
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    put:
      operationId: upsertCarbonBilan
      tags: [carbon]
      summary: Create or update the carbon bilan for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarbonBilanInput"
      responses:
        "200":
          description: Saved carbon bilan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarbonBilan"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    delete:
      operationId: deleteCarbonBilan
      tags: [carbon]
      summary: Delete the carbon bilan for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden


  # ─── ACTIONS RSE ─────────────────────────────────────────────────────────────
  /organizations/{orgId}/actions/library:
    get:
      operationId: listActionLibrary
      tags: [actions]
      summary: List RSE action library
      description: Returns all active actions from the Cocci referentiel (no exercise filter).
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Library actions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionLibraryItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/actions/plan:
    get:
      operationId: listActionPlan
      tags: [actions]
      summary: List action plan items for active exercise
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Plan items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActionPlanItem"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: addActionToPlan
      tags: [actions]
      summary: Add action to plan
      description: Add an action from the library or a custom manual action to the plan.
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionPlanItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPlanItemRaw"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "409":
          description: Already in plan

  /organizations/{orgId}/actions/plan/{actionId}:
    patch:
      operationId: updateActionPlanItem
      tags: [actions]
      summary: Update plan item (check, comment, date, justification)
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
        - name: actionId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionPlanItemUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionPlanItemRaw"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    delete:
      operationId: deleteActionPlanItem
      tags: [actions]
      summary: Remove action from plan
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
        - name: actionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "404":
          description: Not found

  # ─── PLAN D'ACTION COCCI (SLOTS) ─────────────────────────────────────────────

  /organizations/{orgId}/plan-slots:
    get:
      operationId: listPlanSlots
      tags: [actions]
      summary: List plan slots for current exercise
      description: Returns the 15 active slots + done slots for the current exercise.
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Plan slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanSlot"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/plan-slots/initialize:
    post:
      operationId: initializePlanSlots
      tags: [actions]
      summary: Initialize 15 plan slots (idempotent)
      description: Seeds the plan with 15 actions from the library if not already done.
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Plan initialized (or already initialized)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanSlot"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/plan-slots/{slotId}:
    patch:
      operationId: updatePlanSlot
      tags: [actions]
      summary: Update a plan slot (mark done, comment, justification)
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
        - { name: slotId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanSlotUpdate"
      responses:
        "200":
          description: Updated slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanSlotUpdateResult"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /organizations/{orgId}/plan-slots/achievements:
    get:
      operationId: listPlanAchievements
      tags: [actions]
      summary: List all done slots across all exercises (Réalisations)
      parameters:
        - { name: orgId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Achievements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanAchievement"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ─── DIAGNOSTIC RSE ──────────────────────────────────────────────────────────
  /organizations/{orgId}/diagnostic/responses:
    get:
      operationId: getDiagnosticResponses
      tags: [diagnostic]
      summary: Get all diagnostic responses for an exercise
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of diagnostic responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagnosticResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    put:
      operationId: upsertDiagnosticResponses
      tags: [diagnostic]
      summary: Upsert diagnostic responses (batch)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticResponsesInput"
      responses:
        "200":
          description: Updated responses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagnosticResponse"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/diagnostic/scores:
    get:
      operationId: getDiagnosticScores
      tags: [diagnostic]
      summary: Get computed diagnostic scores per subcategory
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Diagnostic scores per subcategory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagnosticSubcategoryScore"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/diagnostic/prefill:
    get:
      operationId: getDiagnosticPrefill
      tags: [diagnostic]
      summary: Get intelligent pre-fill suggestions from existing module data
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pre-fill suggestions per question
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DiagnosticPrefillSuggestion"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── USER ──────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, clerkId, email, isSuperAdmin, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    # ─── ORGANIZATION ──────────────────────────────────────────────────────────
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        legalName:
          type: ["string", "null"]
        siret:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
          description: "TPE / PME / ETI / GE"
        logoUrl:
          type: ["string", "null"]
        exerciseOpeningMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: >
            Month (1-12) from which "Clôturer et créer l'exercice suivant" becomes available.
            Defaults to 12 (Décembre).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        legalName:
          type: string
        siret:
          type: string
        sector:
          type: string
        size:
          type: string
          enum: [TPE, PME, ETI, GE]
        exerciseOpeningMonth:
          type: integer
          minimum: 1
          maximum: 12

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        legalName:
          type: string
        siret:
          type: string
        sector:
          type: string
        size:
          type: string
          enum: [TPE, PME, ETI, GE]
        exerciseOpeningMonth:
          type: integer
          minimum: 1
          maximum: 12

    # ─── MEMBER ────────────────────────────────────────────────────────────────
    Member:
      type: object
      required: [id, userId, organizationId, role, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        organizationId:
          type: integer
        role:
          type: string
          enum: [owner, admin, member, viewer]
        status:
          type: string
          enum: [active, invited, suspended]
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time

    MemberInvite:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member, viewer]

    MemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member, viewer]
        status:
          type: string
          enum: [active, suspended]

    # ─── ADMIN ─────────────────────────────────────────────────────────────────
    AdminStats:
      type: object
      required: [organizationCount, userCount, memberCount]
      properties:
        organizationCount:
          type: integer
        userCount:
          type: integer
        memberCount:
          type: integer

    AdminOrganization:
      type: object
      required: [id, name, createdAt, memberCount]
      properties:
        id:
          type: integer
        name:
          type: string
        legalName:
          type: ["string", "null"]
        siret:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AdminUser:
      type: object
      required: [id, clerkId, email, isSuperAdmin, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AdminMember:
      type: object
      required: [id, role, status, createdAt, user]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [owner, admin, member, viewer]
        status:
          type: string
          enum: [active, invited, suspended]
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          required: [id, email, isSuperAdmin]
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            firstName:
              type: ["string", "null"]
            lastName:
              type: ["string", "null"]
            avatarUrl:
              type: ["string", "null"]
            isSuperAdmin:
              type: boolean

    SuperAdminUpdate:
      type: object
      required: [isSuperAdmin]
      properties:
        isSuperAdmin:
          type: boolean

    # ─── RESOURCE ───────────────────────────────────────────────────────────────
    Resource:
      type: object
      required: [id, organizationId, title, isPublished, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        documentType:
          type: ["string", "null"]
          description: "PDF, Word, Excel, Vidéo, Lien, Autre"
        imageUrl:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        isPublished:
          type: boolean
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourceInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        category:
          type: string
        documentType:
          type: string
        imageUrl:
          type: string
        fileUrl:
          type: string

    ResourcePublishUpdate:
      type: object
      required: [isPublished]
      properties:
        isPublished:
          type: boolean

    # ─── STAKEHOLDER ────────────────────────────────────────────────────────────
    Stakeholder:
      type: object
      required: [id, organizationId, name, category, influence, interest, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        name:
          type: string
        category:
          type: string
        subcategory:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        influence:
          type: integer
          minimum: 1
          maximum: 5
        interest:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── EXERCISE ───────────────────────────────────────────────────────────────
    Exercise:
      type: object
      required: [id, organizationId, year, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        year:
          type: integer
        status:
          type: string
          enum: [active, closed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StakeholderInput:
      type: object
      required: [category, influence, interest]
      properties:
        name:
          type: string
        category:
          type: string
        subcategory:
          type: string
        description:
          type: string
        influence:
          type: integer
          minimum: 1
          maximum: 5
        interest:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: string

    StakeholderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        subcategory:
          type: string
        description:
          type: string
        influence:
          type: integer
          minimum: 1
          maximum: 5
        interest:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: string

    # ─── ISSUES ────────────────────────────────────────────────────────────────
    IssueRatedItem:
      type: object
      required: [key, category, label, isCustom]
      properties:
        key:
          type: string
        category:
          type: string
        label:
          type: string
        isCustom:
          type: boolean
        customId:
          type: ["integer", "null"]
        stakeholderScore:
          type: ["integer", "null"]
        companyScore:
          type: ["integer", "null"]
        impactScore:
          type: ["integer", "null"]
        tendance:
          type: ["string", "null"]

    IssuesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueRatedItem"

    IssueRatingInput:
      type: object
      required: [issueKey]
      properties:
        issueKey:
          type: string
        stakeholderScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        companyScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        impactScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        tendance:
          type: ["string", "null"]
          enum: ["+", "=", "-"]

    IssueRating:
      type: object
      required: [id, organizationId, issueKey, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        issueKey:
          type: string
        stakeholderScore:
          type: ["integer", "null"]
        companyScore:
          type: ["integer", "null"]
        impactScore:
          type: ["integer", "null"]
        tendance:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time

    CustomIssueInput:
      type: object
      required: [category, label]
      properties:
        category:
          type: string
        label:
          type: string

    CustomIssue:
      type: object
      required: [id, organizationId, category, label, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        category:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time

    SuperIssue:
      type: object
      required: [title, summary, issues, avgScore]
      properties:
        title:
          type: string
        summary:
          type: string
        issues:
          type: array
          items:
            type: string
        avgScore:
          type: number

    IssueAnalysisResult:
      type: object
      required: [superIssues, generatedAt]
      properties:
        superIssues:
          type: array
          items:
            $ref: "#/components/schemas/SuperIssue"
        generatedAt:
          type: string
          format: date-time

    # ─── DOCUMENT ───────────────────────────────────────────────────────────────
    DocumentMeta:
      type: object
      required: [id, organizationId, uploadedByUserId, category, originalName, mimeType, size, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        uploadedByUserId:
          type: integer
        category:
          type: string
        label:
          type: ["string", "null"]
          description: Custom label for personalized documents
        description:
          type: ["string", "null"]
          description: Custom description for personalized documents
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        createdAt:
          type: string
          format: date-time

    # ─── CARBON BILAN ───────────────────────────────────────────────────────────
    CarbonBilanInput:
      type: object
      required: [year, mode]
      properties:
        year:
          type: integer
        mode:
          type: string
          enum: [saisie, estimation]
        status:
          type: string
          enum: [draft, validated]
        # Saisie — poste par poste
        methodology:
          type: ["string", "null"]
        scope:
          type: ["string", "null"]
        energie1:
          type: ["number", "null"]
        energie2:
          type: ["number", "null"]
        horsEnergie1:
          type: ["number", "null"]
        horsEnergie2:
          type: ["number", "null"]
        intrantsBiens:
          type: ["number", "null"]
        intrantsServices:
          type: ["number", "null"]
        futursEmballages:
          type: ["number", "null"]
        fret:
          type: ["number", "null"]
        deplacements:
          type: ["number", "null"]
        dechetsDirects:
          type: ["number", "null"]
        immobilisations:
          type: ["number", "null"]
        utilisation:
          type: ["number", "null"]
        finDeVie:
          type: ["number", "null"]
        # Estimation — données physiques
        estEmployeeCount:
          type: ["integer", "null"]
        estOfficeSqm:
          type: ["integer", "null"]
        estSubsidiaryCount:
          type: ["integer", "null"]
        estHeatingType:
          type: ["string", "null"]
        estElecKwhYear:
          type: ["number", "null"]
        estVehicleCount:
          type: ["integer", "null"]
        estVehicleFuelType:
          type: ["string", "null"]
        estTrainKmYear:
          type: ["number", "null"]
        estPlaneKmYear:
          type: ["number", "null"]
        estBuysGoodsKeur:
          type: ["number", "null"]
        estBuysServicesKeur:
          type: ["number", "null"]
        estWasteTons:
          type: ["number", "null"]
        estFreightTkm:
          type: ["number", "null"]
        # Utilisation calculator
        utilProductType:
          type: ["string", "null"]
        utilUnitsSold:
          type: ["integer", "null"]
        utilLifespanYears:
          type: ["number", "null"]
