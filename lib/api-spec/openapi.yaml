openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: A-NIM-PACT RSE SaaS Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile management
  - name: organizations
    description: Organization (company) management
  - name: members
    description: Organization membership management
  - name: dashboard
    description: Dashboard summary endpoints
  - name: admin
    description: Superadmin back-office endpoints
  - name: resources
    description: Document library management
  - name: stakeholders
    description: Stakeholder (parties prenantes) management
  - name: carbon
    description: Bilan Carbone® management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── USER PROFILE ────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      description: Returns the authenticated user's profile (JIT-provisioned from Clerk)
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  # ─── ORGANIZATIONS ───────────────────────────────────────────────────────────
  /organizations:
    get:
      operationId: listOrganizations
      tags: [organizations]
      summary: List organizations for current user
      description: Returns all organizations the authenticated user belongs to
      responses:
        "200":
          description: List of organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create a new organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized

  /organizations/{id}:
    get:
      operationId: getOrganization
      tags: [organizations]
      summary: Get organization by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Organization details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    patch:
      operationId: updateOrganization
      tags: [organizations]
      summary: Update organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ─── MEMBERS ─────────────────────────────────────────────────────────────────
  /organizations/{id}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members of an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: inviteMember
      tags: [members]
      summary: Invite a user to an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInvite"
      responses:
        "201":
          description: Member invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{id}/members/{memberId}:
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member's role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member from an organization
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: memberId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Member removed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /organizations/{id}/dashboard:
    get:
      operationId: getOrganizationDashboard
      tags: [dashboard]
      summary: Get dashboard summary for an organization
      description: Returns key RSE metrics summary — member count, active modules, completion rate
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ─── ADMIN ───────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Global platform statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/organizations:
    get:
      operationId: listAdminOrganizations
      tags: [admin]
      summary: List all organizations (superadmin)
      responses:
        "200":
          description: All organizations with member counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrganization"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/organizations/{id}/members:
    get:
      operationId: listAdminOrgMembers
      tags: [admin]
      summary: List members of any organization (superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminMember"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users (superadmin)
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/users/{id}/superadmin:
    patch:
      operationId: updateUserSuperAdmin
      tags: [admin]
      summary: Promote or demote superadmin status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuperAdminUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ─── ADMIN RESOURCES ─────────────────────────────────────────────────────────
  /admin/organizations/{orgId}/resources:
    get:
      operationId: listAdminOrgResources
      tags: [admin]
      summary: List all resources of an organization (superadmin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resources list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createAdminResource
      tags: [admin]
      summary: Create a resource for an organization (superadmin)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Created resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /admin/resources/{id}:
    patch:
      operationId: updateAdminResource
      tags: [admin]
      summary: Update a resource (superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteAdminResource
      tags: [admin]
      summary: Delete a resource (superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /admin/resources/{id}/publish:
    patch:
      operationId: publishAdminResource
      tags: [admin]
      summary: Publish or unpublish a resource (superadmin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePublishUpdate"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ─── STAKEHOLDERS ────────────────────────────────────────────────────────────
  /organizations/{orgId}/stakeholders:
    get:
      operationId: listStakeholders
      tags: [stakeholders]
      summary: List all stakeholders for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of stakeholders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stakeholder"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createStakeholder
      tags: [stakeholders]
      summary: Create a stakeholder
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakeholderInput"
      responses:
        "201":
          description: Created stakeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/stakeholders/{id}:
    get:
      operationId: getStakeholder
      tags: [stakeholders]
      summary: Get a single stakeholder
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stakeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    put:
      operationId: updateStakeholder
      tags: [stakeholders]
      summary: Update a stakeholder
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StakeholderUpdate"
      responses:
        "200":
          description: Updated stakeholder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteStakeholder
      tags: [stakeholders]
      summary: Delete a stakeholder
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  # ─── CLIENT RESOURCES ────────────────────────────────────────────────────────
  /organizations/{orgId}/resources:
    get:
      operationId: listOrgResources
      tags: [resources]
      summary: List published resources for an organization (client)
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published resources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Resource"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ─── ISSUES ─────────────────────────────────────────────────────────────────
  /organizations/{orgId}/issues:
    get:
      operationId: getIssues
      tags: [issues]
      summary: Get all issues with ratings for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Issues list with ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuesResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    post:
      operationId: createCustomIssue
      tags: [issues]
      summary: Add a custom issue
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomIssueInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomIssue"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/issues/ratings:
    put:
      operationId: upsertIssueRating
      tags: [issues]
      summary: Set stakeholder and/or company score for an issue
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueRatingInput"
      responses:
        "200":
          description: Updated rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueRating"
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/issues/custom/{issueId}:
    delete:
      operationId: deleteCustomIssue
      tags: [issues]
      summary: Delete a custom issue
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: issueId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  /organizations/{orgId}/issues/analyze:
    post:
      operationId: analyzeIssues
      tags: [issues]
      summary: Run AI analysis on top 12 material issues
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: AI analysis with super-issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueAnalysisResult"
        "400":
          description: Not enough rated issues
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/issues/analysis:
    get:
      operationId: getIssueAnalysis
      tags: [issues]
      summary: Get the latest saved AI analysis
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Latest analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssueAnalysisResult"
        "404":
          description: No analysis yet
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ─── DOCUMENTS ──────────────────────────────────────────────────────────────
  /organizations/{orgId}/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentMeta"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /organizations/{orgId}/documents/{docId}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
        - name: docId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  # ─── BILAN CARBONE ──────────────────────────────────────────────────────────
  /organizations/{orgId}/carbon:
    get:
      operationId: getCarbonBilan
      tags: [carbon]
      summary: Get the carbon bilan for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Carbon bilan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarbonBilan"
        "404":
          description: No bilan yet
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    put:
      operationId: upsertCarbonBilan
      tags: [carbon]
      summary: Create or update the carbon bilan for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CarbonBilanInput"
      responses:
        "200":
          description: Saved carbon bilan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CarbonBilan"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    delete:
      operationId: deleteCarbonBilan
      tags: [carbon]
      summary: Delete the carbon bilan for an organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── USER ──────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, clerkId, email, isSuperAdmin, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    # ─── ORGANIZATION ──────────────────────────────────────────────────────────
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        legalName:
          type: ["string", "null"]
        siret:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
          description: "TPE / PME / ETI / GE"
        logoUrl:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        legalName:
          type: string
        siret:
          type: string
        sector:
          type: string
        size:
          type: string
          enum: [TPE, PME, ETI, GE]

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        legalName:
          type: string
        siret:
          type: string
        sector:
          type: string
        size:
          type: string
          enum: [TPE, PME, ETI, GE]

    # ─── MEMBER ────────────────────────────────────────────────────────────────
    Member:
      type: object
      required: [id, userId, organizationId, role, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        organizationId:
          type: integer
        role:
          type: string
          enum: [owner, admin, member, viewer]
        status:
          type: string
          enum: [active, invited, suspended]
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time

    MemberInvite:
      type: object
      required: [email, role]
      properties:
