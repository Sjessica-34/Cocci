components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ─── USER ──────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, clerkId, email, isSuperAdmin, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    # ─── ORGANIZATION ──────────────────────────────────────────────────────────
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        legalName:
          type: ["string", "null"]
        siret:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
          description: "TPE / PME / ETI / GE"
        logoUrl:
          type: ["string", "null"]
        exerciseOpeningMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: >
            Month (1-12) from which "Clôturer et créer l'exercice suivant" becomes available.
            Defaults to 12 (Décembre).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrganizationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        legalName:
          type: string
        siret:
          type: string
        sector:
          type: string
        size:
          type: string
          enum: [TPE, PME, ETI, GE]
        exerciseOpeningMonth:
          type: integer
          minimum: 1
          maximum: 12

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        legalName:
          type: string
        siret:
          type: string
        sector:
          type: string
        size:
          type: string
          enum: [TPE, PME, ETI, GE]
        exerciseOpeningMonth:
          type: integer
          minimum: 1
          maximum: 12

    # ─── MEMBER ────────────────────────────────────────────────────────────────
    Member:
      type: object
      required: [id, userId, organizationId, role, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        organizationId:
          type: integer
        role:
          type: string
          enum: [owner, admin, member, viewer]
        status:
          type: string
          enum: [active, invited, suspended]
        user:
          $ref: "#/components/schemas/User"
        createdAt:
          type: string
          format: date-time

    MemberInvite:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, member, viewer]

    MemberUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, member, viewer]
        status:
          type: string
          enum: [active, suspended]

    # ─── ADMIN ─────────────────────────────────────────────────────────────────
    AdminStats:
      type: object
      required: [organizationCount, userCount, memberCount]
      properties:
        organizationCount:
          type: integer
        userCount:
          type: integer
        memberCount:
          type: integer

    AdminOrganization:
      type: object
      required: [id, name, createdAt, memberCount]
      properties:
        id:
          type: integer
        name:
          type: string
        legalName:
          type: ["string", "null"]
        siret:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    AdminUser:
      type: object
      required: [id, clerkId, email, isSuperAdmin, createdAt]
      properties:
        id:
          type: integer
        clerkId:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        avatarUrl:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AdminMember:
      type: object
      required: [id, role, status, createdAt, user]
      properties:
        id:
          type: integer
        role:
          type: string
          enum: [owner, admin, member, viewer]
        status:
          type: string
          enum: [active, invited, suspended]
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          required: [id, email, isSuperAdmin]
          properties:
            id:
              type: integer
            email:
              type: string
              format: email
            firstName:
              type: ["string", "null"]
            lastName:
              type: ["string", "null"]
            avatarUrl:
              type: ["string", "null"]
            isSuperAdmin:
              type: boolean

    SuperAdminUpdate:
      type: object
      required: [isSuperAdmin]
      properties:
        isSuperAdmin:
          type: boolean

    # ─── RESOURCE ───────────────────────────────────────────────────────────────
    Resource:
      type: object
      required: [id, organizationId, title, isPublished, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        title:
          type: string
        description:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        documentType:
          type: ["string", "null"]
          description: "PDF, Word, Excel, Vidéo, Lien, Autre"
        imageUrl:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        isPublished:
          type: boolean
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ResourceInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        category:
          type: string
        documentType:
          type: string
        imageUrl:
          type: string
        fileUrl:
          type: string

    ResourcePublishUpdate:
      type: object
      required: [isPublished]
      properties:
        isPublished:
          type: boolean

    # ─── STAKEHOLDER ────────────────────────────────────────────────────────────
    Stakeholder:
      type: object
      required: [id, organizationId, name, category, influence, interest, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        name:
          type: string
        category:
          type: string
        subcategory:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        influence:
          type: integer
          minimum: 1
          maximum: 5
        interest:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── EXERCISE ───────────────────────────────────────────────────────────────
    Exercise:
      type: object
      required: [id, organizationId, year, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        year:
          type: integer
        status:
          type: string
          enum: [active, closed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StakeholderInput:
      type: object
      required: [category, influence, interest]
      properties:
        name:
          type: string
        category:
          type: string
        subcategory:
          type: string
        description:
          type: string
        influence:
          type: integer
          minimum: 1
          maximum: 5
        interest:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: string

    StakeholderUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
        subcategory:
          type: string
        description:
          type: string
        influence:
          type: integer
          minimum: 1
          maximum: 5
        interest:
          type: integer
          minimum: 1
          maximum: 5
        notes:
          type: string

    # ─── ISSUES ────────────────────────────────────────────────────────────────
    IssueRatedItem:
      type: object
      required: [key, category, label, isCustom]
      properties:
        key:
          type: string
        category:
          type: string
        label:
          type: string
        isCustom:
          type: boolean
        customId:
          type: ["integer", "null"]
        stakeholderScore:
          type: ["integer", "null"]
        companyScore:
          type: ["integer", "null"]
        impactScore:
          type: ["integer", "null"]
        tendance:
          type: ["string", "null"]

    IssuesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IssueRatedItem"

    IssueRatingInput:
      type: object
      required: [issueKey]
      properties:
        issueKey:
          type: string
        stakeholderScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        companyScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        impactScore:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5
        tendance:
          type: ["string", "null"]
          enum: ["+", "=", "-"]

    IssueRating:
      type: object
      required: [id, organizationId, issueKey, updatedAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        issueKey:
          type: string
        stakeholderScore:
          type: ["integer", "null"]
        companyScore:
          type: ["integer", "null"]
        impactScore:
          type: ["integer", "null"]
        tendance:
          type: ["string", "null"]
        updatedAt:
          type: string
          format: date-time

    CustomIssueInput:
      type: object
      required: [category, label]
      properties:
        category:
          type: string
        label:
          type: string

    CustomIssue:
      type: object
      required: [id, organizationId, category, label, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        category:
          type: string
        label:
          type: string
        createdAt:
          type: string
          format: date-time

    SuperIssue:
      type: object
      required: [title, summary, issues, avgScore]
      properties:
        title:
          type: string
        summary:
          type: string
        issues:
          type: array
          items:
            type: string
        avgScore:
          type: number

    IssueAnalysisResult:
      type: object
      required: [superIssues, generatedAt]
      properties:
        superIssues:
          type: array
          items:
            $ref: "#/components/schemas/SuperIssue"
        generatedAt:
          type: string
          format: date-time

    # ─── DOCUMENT ───────────────────────────────────────────────────────────────
    DocumentMeta:
      type: object
      required: [id, organizationId, uploadedByUserId, category, originalName, mimeType, size, createdAt]
      properties:
        id:
          type: integer
        organizationId:
          type: integer
        uploadedByUserId:
          type: integer
        category:
          type: string
        originalName:
          type: string
